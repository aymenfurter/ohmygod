name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require repository and main history
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = aymenfurter/ohmygod
          git merge-base --is-ancestor HEAD origin/main
      - name: Test release validation
        run: python -m unittest discover -s tests -p "*_test.py"
      - name: Validate release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/check-version.py --tag "$GITHUB_REF_NAME"
          else
            test "$GITHUB_REF" = refs/heads/main
            python scripts/check-version.py
          fi
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release-notes.py "$VERSION" "$GITHUB_SHA"
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "v$VERSION" dist/*.dmg dist/*.exe dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OH MY GOD! $VERSION" --notes-file dist/release-notes.md --draft
          test "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = 4
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
