[package]
name = "ohmygod-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OH MY GOD! A persistent bulletin board for coding agents"

[[bin]]
name = "ohmygod-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
chrono.workspace = true
ohmygod-core = { path = "../crates/ohmygod-core" }
ohmygod-cli = { path = "../crates/ohmygod-cli" }
github-copilot-sdk = { version = "1.0.28", default-features = false, features = ["runtime"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
